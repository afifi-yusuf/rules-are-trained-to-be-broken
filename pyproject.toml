[project]
name = "rtb"
version = "0.1.0"
description = "Rules Are Trained To Be Broken: synthetic data + RL environment"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# SkyRL itself (skyrl[fsdp]) is installed from its own checkout on the GPU box;
# skyrl-gym is enough to build and test the env adapter.
train = ["skyrl-gym>=0.4", "pandas>=2", "pyarrow>=15"]
eval = ["openai>=1.40", "pandas>=2", "pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8", "rtb[train,eval]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
