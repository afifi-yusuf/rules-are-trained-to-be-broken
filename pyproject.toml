[project]
name = "rtb"
version = "0.1.0"
description = "Rules Are Trained To Be Broken: synthetic data + RL environment"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
