[project]
name = "rtb"
version = "0.1.0"
description = "Rules Are Trained To Be Broken: synthetic data + RL environment"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# SkyRL itself (skyrl[fsdp]) is installed from its own checkout on the GPU box;
# skyrl-gym is enough to build and test the env adapter.
train = ["skyrl-gym>=0.4", "pandas>=2", "pyarrow>=15"]
eval = ["openai>=1.40", "pandas>=2", "pyarrow>=15"]
# UK AISI's misalignment suite (MacDiarmid et al. evals, strict judge), pinned to a commit; runs on Inspect.
aisi = [
    "openai>=1.40",
    "anthropic>=0.40",
    "misalignment-evals @ git+https://github.com/UKGovernmentBEIS/reward-hacking-misalignment@1c0a303#subdirectory=misalignment-evals",
]

[dependency-groups]
dev = ["pytest>=8", "rtb[train,eval]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true  # the pinned AISI eval suite (aisi extra) installs from GitHub
